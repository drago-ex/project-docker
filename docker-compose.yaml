services:

  # the PHP runtime (docker/Dockerfile), only built as the base of the server image
  php:
    build: docker
    profiles: [build]

  # php server settings; the project is copied into the image (docker/Dockerfile-app),
  # `docker compose watch` copies changed files into the container
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile-app
      additional_contexts:
        php: service:php
    # debug mode (Tracy) and function arguments in stack traces only when asked for: docker/.env.development
    environment:
      NETTE_DEBUG: ${NETTE_DEBUG:-0}
      PHP_EXCEPTION_IGNORE_ARGS: ${PHP_EXCEPTION_IGNORE_ARGS:-1}
    restart: always
    security_opt:
      - no-new-privileges:true
    # what the application writes and a new image must keep: logs and uploaded files
    volumes:
      - ./log/:/var/www/html/log/
      - ./www/upload/:/var/www/html/www/upload/
    # only on this computer; SERVER_PORT=8080 publishes it on every interface (Docker bypasses ufw)
    ports:
      - "${SERVER_PORT:-127.0.0.1:8080}:80"
    develop:
      watch:
        - action: sync
          path: ./app
          target: /var/www/html/app
        - action: sync
          path: ./www
          target: /var/www/html/www
          ignore:
            - upload/
        # vendor is in the image, so changed packages need a new one
        - action: rebuild
          path: ./composer.lock
