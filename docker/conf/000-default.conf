<VirtualHost *:80>

	ServerName localhost
	ServerAdmin admin@localhost
	DocumentRoot /var/www/html/www
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	# security headers (X-Frame-Options is sent by Nette)
	Header always set X-Content-Type-Options "nosniff"
	Header always set Referrer-Policy "strict-origin-when-cross-origin"

	# uploaded files are only served, never run as PHP, and an uploaded .htaccess is ignored;
	# an uploaded SVG or HTML opened directly runs no script (sandbox) and loads nothing else
	<Directory /var/www/html/www/upload>
		AllowOverride None
		php_admin_flag engine off
		Header always set Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox"
		<FilesMatch "\.(php\d?|phtml|phar)$">
			Require all denied
		</FilesMatch>
	</Directory>

</VirtualHost>
