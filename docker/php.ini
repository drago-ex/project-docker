[php]
file_uploads = On
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 60

; Keep response headers available for sessions initialized during rendering.
output_buffering = 4096
implicit_flush = Off

; Security: no PHP version in headers, errors are logged, never shown (Tracy shows them in debug mode).
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
allow_url_include = Off

; Stack traces in logs leave out function arguments (passwords, tokens), except in development
; (docker-compose.yaml, docker/.env.development); left out also when the variable is not set.
zend.exception_ignore_args = ${PHP_EXCEPTION_IGNORE_ARGS:-1}

; Functions that run shell commands, a webshell's main tool. This file is also read by the PHP CLI
; in the container, so enable it only when nothing there needs them (e.g. Composer).
;disable_functions = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec

[Session]
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
; Nette marks the session cookie secure by itself on HTTPS (behind a reverse proxy only with `http: proxy:`).
; Only behind HTTPS, otherwise the session cookie is never sent.
;session.cookie_secure = 1

[Date]
date.timezone = Europe/Prague
